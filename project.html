<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />

    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/reset.css?v=8" />
  <link rel="stylesheet" href="assets/css/style.css?v=8" />

  <!-- SEO & OGP -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:site_name" content="JAN STUDIO">
  <meta property="og:title" content="Case Study | JAN STUDIO">
  <meta property="og:description" content="JAN STUDIO の撮影実績・Case Study詳細ページ。">

<body class="page-project">
  <site-header></site-header>

  <main id="main">
    <section class="page-hero container">
      <a href="/works" class="back-link">Works一覧へ戻る</a>
      <p class="page-eyebrow">Case Study</p>
      <h1 class="page-title" id="project-title">撮影案件タイトル</h1>
      <p class="page-meta" id="project-meta">
        <!-- クライアント名やカテゴリーを表示 -->
      </p>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container project-hero">
        <div class="project-hero-image">
          <img src="" alt="" id="project-main-image" />
        </div>
        <div class="project-summary">
          <p class="section-kicker">Background</p>
          <h2 class="section-title">背景と課題</h2>
          <p id="project-summary-text">
            <!-- 案件の概要テキスト -->
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p class="section-kicker">Works</p>
        <h2 class="section-title">成果物</h2>
        <div class="project-gallery-grid" id="project-gallery" aria-live="polite" style="margin-top: 40px;">
          <!-- 案件に紐づく写真一覧 -->
        </div>
      </div>
    </section>

    <section class="section band">
      <div class="container project-story">
        <p class="section-kicker">Process</p>
        <h2 class="section-title">撮影プロセス・成果</h2>
        <p id="project-story-text">
          <!-- 撮影ストーリー -->
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container project-credits" style="max-width: 800px;">
        <p class="section-kicker">Credits</p>
        <h2 class="section-title">クレジット</h2>
        <ul id="project-credits-list">
          <!-- クレジット情報 -->
        </ul>
      </div>
    </section>

    <section class="section section-cta">
      <div class="container cta-inner" data-reveal>
        <p class="section-kicker section-kicker-light">Contact</p>
        <h2 class="section-title">似た案件をご希望ですか？</h2>
        <p class="section-lead">
          このCase Studyのようなテイストでの撮影や、近い課題をお持ちの方は、お気軽にご相談ください。
        </p>
        <div class="cta-actions">
          <a href="/contact?type=shoot" class="btn primary large">似た撮影を依頼する</a>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <a href="/contact?type=shoot" class="floating-cta" id="floating-cta">撮影を相談する</a>

  <script src="assets/js/config.js?v=8"></script>
  <script src="assets/js/api.js?v=8"></script>
  <script src="assets/js/motion.js?v=8"></script>
  <script src="assets/js/project.js?v=8"></script>
</body>

</html>
