<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Contact | JAN STUDIO</title>
  <meta name="description" content="JAN STUDIOへのご相談・お問い合わせフォーム。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/reset.css?v=7" />
  <link rel="stylesheet" href="assets/css/style.css?v=7" />

  <!-- SEO & OGP -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://janstudio.app/contact.html">
  <meta property="og:site_name" content="JAN STUDIO">
  <meta property="og:title" content="Contact | JAN STUDIO">
  <meta property="og:description" content="JAN STUDIOへのご相談・お問い合わせフォーム。">
  <meta property="og:image" content="https://janstudio.app/assets/img/hero-bg.jpg">
  <meta property="og:url" content="https://janstudio.app/contact.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="assets/js/components.js?v=7" defer></script>
</head>

<body class="page-contact">
  <site-header></site-header>

  <main id="main">
    <section class="page-hero container">
      <div data-reveal>
        <p class="page-eyebrow">Contact</p>
        <h1 class="page-title">まずは、<span class="serif-accent" style="color:var(--accent);">話す</span>ことから。</h1>
        <p class="page-lead">
          撮影に関するご相談やご依頼はこちらのフォームから承ります。お気軽にご相談ください。
        </p>
      </div>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container contact-layout">
        <!-- 送信完了メッセージ（?success=true でリダイレクトされた際にJSで表示） -->
        <div id="form-success" class="contact-form" hidden>
          <p class="section-kicker">Thank you</p>
          <h2 class="section-title">送信が完了しました</h2>
          <p style="margin-top: 16px; color: var(--muted);">
            お問い合わせありがとうございます。内容を確認のうえ、通常48時間以内にご連絡いたします。
          </p>
          <a href="index.html" class="btn primary" style="margin-top: 28px;">トップへ戻る</a>
        </div>

        <form id="contact-form" class="contact-form" action="https://formsubmit.co/contact@janstudio.app" method="POST"
          novalidate data-reveal>
          <input type="hidden" name="_next" value="https://janstudio.app/contact.html?success=true">
          <input type="hidden" name="_subject" value="【JAN STUDIO】サイトからのお問い合わせ">
          <input type="hidden" name="_captcha" value="false">
          <!-- スパムボット対策のハニーポット（人間には見えない） -->
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

          <div class="form-field">
            <label for="type">ご用件 <span class="required">*</span></label>
            <select id="type" name="type" required>
              <option value="shoot" selected>撮影のご依頼・ご相談</option>
              <option value="media">取材・メディア掲載について</option>
              <option value="partner">協力・パートナーシップについて</option>
              <option value="other">その他</option>
            </select>
            <p class="field-error" data-error-for="type"></p>
          </div>

          <div class="form-field">
            <label for="name">お名前 <span class="required">*</span></label>
            <input type="text" id="name" name="name" autocomplete="name" required />
            <p class="field-error" data-error-for="name"></p>
          </div>

          <div class="form-field">
            <label for="email">メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>

          <div class="form-field" id="field-date">
            <label for="date">ご希望の時期・日程（撮影の場合）</label>
            <input type="text" id="date" name="date" placeholder="例）20XX年○月頃、平日希望 など" />
          </div>

          <div class="form-field">
            <label for="message">ご相談内容・お問い合わせ内容 <span class="required">*</span></label>
            <textarea id="message" name="message" rows="6" required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>

          <p class="form-note">
            送信いただいた内容を確認のうえ、通常48時間以内にご連絡いたします。
          </p>

          <div class="form-actions">
            <button type="submit" class="btn primary">送信する</button>
            <p class="form-status" id="form-status" aria-live="polite"></p>
          </div>
        </form>

        <aside class="contact-side" data-reveal data-reveal-delay="120">
          <p class="section-kicker">SNS</p>
          <h2 class="section-title">直接のご連絡</h2>
          <p>お急ぎの場合や、最新の活動についてはInstagramもご活用ください。</p>
          <p class="contact-email" style="margin-top: 20px;">
            <a href="https://www.instagram.com/jantsuruoka_etuning" target="_blank" rel="noopener noreferrer">
              Instagram @jantsuruoka_etuning ↗
            </a>
          </p>
        </aside>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="assets/js/config.js?v=7"></script>
  <script src="assets/js/api.js?v=7"></script>
  <script src="assets/js/motion.js?v=7"></script>
  <script src="assets/js/contact.js?v=7"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // URLパラメータに応じてご用件を自動選択
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      if (type) {
        const select = document.getElementById('type');
        if (select) {
          const match = Array.from(select.options).find(opt => opt.value === type);
          if (match) select.value = type;
        }
      }
    });
  </script>
</body>

</html>
