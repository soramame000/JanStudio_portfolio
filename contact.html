<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | JAN STUDIO</title>
  <meta name="description" content="JAN STUDIOへのご相談・お問い合わせフォーム。" />
  <link rel="stylesheet" href="assets/css/reset.css?v=2" />
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <link rel="stylesheet" href="assets/css/renewal.css?v=2" />

  <!-- SEO & OGP -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="JAN STUDIO">
  <meta property="og:description" content="あなたの大切な瞬間を、もっと美しく。記憶に残り続ける一枚を。">
  <meta property="og:image" content="https://janstudio.app/assets/img/hero-bg.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="assets/js/components.js"></script>
</head>
<body class="page-contact">
  <site-header></site-header>

  <main>
    <section class="page-hero container">
      <p class="page-eyebrow">Contact</p>
      <h1 class="page-title">お問い合わせ</h1>
      <p class="page-lead">
        撮影に関するご相談やご依頼はこちらのフォームから承ります。お気軽にご相談ください。
      </p>
    </section>

    <section class="section">
      <div class="container contact-layout">
        <form id="contact-form" class="contact-form" action="https://formsubmit.co/contact@janstudio.app" method="POST" novalidate>
          <input type="hidden" name="_next" value="https://janstudio.app/contact.html?success=true">
          <div class="form-field">
            <label for="type">ご用件 <span class="required">*</span></label>
            <select id="type" name="type" required>
              <option value="shoot" selected>撮影のご依頼・ご相談</option>
              <option value="media">取材・メディア掲載について</option>
              <option value="partner">協力・パートナーシップについて</option>
              <option value="other">その他</option>
            </select>
            <p class="field-error" data-error-for="type"></p>
          </div>

          <div class="form-field">
            <label for="name">お名前 <span class="required">*</span></label>
            <input type="text" id="name" name="name" required />
            <p class="field-error" data-error-for="name"></p>
          </div>

          <div class="form-field">
            <label for="email">メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" name="email" required />
            <p class="field-error" data-error-for="email"></p>
          </div>

          <!-- The elements below can be hidden dynamically via JS if type !== 'shoot', but kept visible for simplicity here unless they write that custom logic -->
          <div class="form-field" id="field-date">
            <label for="date">ご希望の時期・日程 (撮影の場合)</label>
            <input type="text" id="date" name="date" placeholder="例）20XX年○月頃、平日希望 など" />
          </div>

          <div class="form-field">
            <label for="message">ご相談内容・お問い合わせ内容 <span class="required">*</span></label>
            <textarea id="message" name="message" rows="6" required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>

          <p class="form-note">
            送信いただいた内容を確認のうえ、通常48時間以内にご連絡いたします。
          </p>

          <div class="form-actions">
            <button type="submit" class="btn primary">送信する</button>
            <p class="form-status" id="form-status" aria-live="polite"></p>
          </div>
        </form>

        <aside class="contact-side">
          <h2 class="section-title">直接のご連絡・SNS</h2>
          <p>お急ぎの場合や、最新の活動についてはInstagramもご活用ください。</p>
          <p class="contact-email" style="margin-top: 16px;">
            Instagram:
            <a href="https://www.instagram.com/itsu_photoooo" target="_blank" rel="noopener noreferrer" style="color:var(--color-accent);">
              <span>@itsu_photoooo</span>
            </a>
          </p>
        </aside>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
  <script src="assets/js/contact.js?v=2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Auto-select type based on url param
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      if (type) {
        const select = document.getElementById('type');
        if (select) {
          const match = Array.from(select.options).find(opt => opt.value === type);
          if (match) select.value = type;
        }
      }
    });
  </script>
</body>
</html>
