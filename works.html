<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works | JAN STUDIO</title>
  <meta name="description" content="JAN STUDIOの撮影実績。スポーツ、音楽、ポートレートなどのCase Studyをご紹介します。" />
  <link rel="stylesheet" href="assets/css/reset.css?v=2" />
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <link rel="stylesheet" href="assets/css/renewal.css?v=2" />

  <!-- SEO & OGP -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="JAN STUDIO">
  <meta property="og:description" content="あなたの大切な瞬間を、もっと美しく。記憶に残り続ける一枚を。">
  <meta property="og:image" content="https://janstudio.app/assets/img/hero-bg.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="assets/js/components.js"></script>
</head>

<body class="page-gallery">
  <site-header></site-header>

  <main class="apple-chargers-gallery">
    <section class="page-hero page-hero-gallery container">
      <div class="page-hero-copy">
        <p class="hero-collab-tag">ポートフォリオ</p>
        <p class="page-eyebrow">Works</p>
        <h1 class="page-title">撮影実績</h1>
        <p class="page-lead">
          スポーツの試合からライブ、ポートレートまで、幅広いシーンでの撮影実績をご紹介します。<br>
          各プロジェクトの写真や背景（Case Study）をご覧いただけます。
        </p>
        <div class="gallery-hero-pills">
          <span>Sports</span>
          <span>Live</span>
          <span>Portrait</span>
          <span>Art</span>
        </div>
      </div>
      <div class="gallery-hero-visual" aria-hidden="true">
        <img class="gallery-hero-video"
          src="assets/img/hero-bg.jpg"
          alt="Works Hero" loading="eager" />
      </div>
    </section>

    <section class="section">
      <div class="container gallery-controls gallery-controls-panel">
        <div class="gallery-controls-head">
          <p class="section-kicker">Filter</p>
          <h2 class="section-title">ジャンル・用途で絞り込み</h2>
          <p class="gallery-count" id="gallery-count" aria-live="polite"></p>
        </div>
        <div class="filter-group" aria-label="ジャンルで絞り込み">
          <button class="filter-btn is-active" data-genre="all">すべて</button>
          <button class="filter-btn" data-genre="american-football">Sports</button>
          <button class="filter-btn" data-genre="music-event">Live (Music event)</button>
          <button class="filter-btn" data-genre="portrait">Portrait</button>
          <button class="filter-btn" data-genre="fine art">Art</button>
        </div>
      </div>

      <div class="container gallery-grid gallery-grid-premium" id="gallery-grid" aria-live="polite">
        <!-- CMSから取得した写真をJavaScriptで描画 -->
      </div>
    </section>

    <section class="section section-cta">
      <div class="container cta-inner text-center">
        <p class="section-kicker section-kicker-light">From Sideline to Campaign</p>
        <h2 class="section-title">似た撮影をご希望ですか？</h2>
        <p class="section-lead">
          イメージに近い写真や案件があれば、それに沿った撮影をご提案します。<br>
          まずは目的や課題をお聞かせください。
        </p>
        <div class="super-cta-actions">
          <a href="contact.html?type=shoot" class="btn primary">撮影のご相談・ご依頼はこちら →</a>
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <div class="lightbox-dialog" role="dialog" aria-modal="true">
        <button class="lightbox-close" type="button" aria-label="閉じる" data-lightbox-close>×</button>
        <div class="lightbox-image-wrapper">
          <img src="" alt="" id="lightbox-image" />
          <button class="lightbox-nav lightbox-prev" type="button" id="lightbox-prev" aria-label="前の写真">‹</button>
          <button class="lightbox-nav lightbox-next" type="button" id="lightbox-next" aria-label="次の写真">›</button>
        </div>
        <div class="lightbox-meta">
          <p class="lightbox-title" id="lightbox-title"></p>
          <p class="lightbox-caption" id="lightbox-caption"></p>
          <div class="lightbox-thumbs" id="lightbox-thumbs" aria-label="サムネイル一覧"></div>
          <a href="#" id="lightbox-project-link" class="section-link target-link" target="_self" style="display:inline-block; margin-top: 10px;">
            この実績の詳細を見る →
          </a>
        </div>
      </div>
    </div>
  </main>

  <site-footer></site-footer>

  <a href="contact.html?type=shoot" class="floating-cta" id="floating-cta">撮影を相談する</a>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/main.js?v=2"></script>
  <script src="assets/js/works.js?v=2"></script>
  <script>
    const floatingCta = document.getElementById("floating-cta");
    if (floatingCta) {
      window.addEventListener("scroll", () => {
        if (window.scrollY > 500) {
          floatingCta.classList.add("visible");
        } else {
          floatingCta.classList.remove("visible");
        }
      });
    }
  </script>
</body>
</html>
