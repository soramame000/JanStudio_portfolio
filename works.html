<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Works | JAN STUDIO</title>
  <meta name="description" content="JAN STUDIOの撮影実績。スポーツ、音楽、ポートレートなどのCase Studyをご紹介します。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/reset.css?v=6" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />

  <!-- SEO & OGP -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://janstudio.app/works.html">
  <meta property="og:site_name" content="JAN STUDIO">
  <meta property="og:title" content="Works | JAN STUDIO">
  <meta property="og:description" content="JAN STUDIOの撮影実績。スポーツ、音楽、ポートレートなどのCase Studyをご紹介します。">
  <meta property="og:image" content="https://janstudio.app/assets/img/hero-bg.jpg">
  <meta property="og:url" content="https://janstudio.app/works.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="assets/js/components.js?v=6" defer></script>
</head>

<body class="page-gallery">
  <site-header></site-header>

  <main id="main">
    <section class="page-hero page-hero-gallery container">
      <div class="page-hero-copy" data-reveal>
        <p class="page-eyebrow">Works</p>
        <h1 class="page-title">撮影実績<br><span class="serif-accent" style="color:var(--muted); font-size:0.55em;">Selected works &amp; case studies</span></h1>
        <p class="page-lead">
          スポーツの試合からライブ、ポートレートまで、幅広いシーンでの撮影実績をご紹介します。
          各プロジェクトの写真や背景（Case Study）をご覧いただけます。
        </p>
        <div class="gallery-hero-pills">
          <span>Sports</span>
          <span>Live</span>
          <span>Portrait</span>
          <span>Art</span>
        </div>
      </div>
      <div class="gallery-hero-visual" aria-hidden="true" data-reveal="right">
        <img src="assets/img/hero-bg.webp" alt="" loading="eager" fetchpriority="high" />
      </div>
    </section>

    <section class="section" style="padding-top: clamp(40px, 6vh, 72px);">
      <div class="container gallery-controls">
        <div class="gallery-controls-head">
          <p class="section-kicker">Filter</p>
          <p class="gallery-count" id="gallery-count" aria-live="polite"></p>
        </div>
        <div class="filter-group" aria-label="ジャンルで絞り込み">
          <button class="filter-btn is-active" data-genre="all">すべて</button>
          <button class="filter-btn" data-genre="american-football">Sports</button>
          <button class="filter-btn" data-genre="music-event">Live</button>
          <button class="filter-btn" data-genre="portrait">Portrait</button>
          <button class="filter-btn" data-genre="fine art">Art</button>
        </div>
      </div>

      <div class="container wide gallery-grid" id="gallery-grid" aria-live="polite">
        <!-- CMSから取得した写真をJavaScriptで描画 -->
      </div>
    </section>

    <section class="section section-cta">
      <div class="container cta-inner" data-reveal>
        <p class="section-kicker section-kicker-light">From Sideline to Campaign</p>
        <h2 class="section-title">似た撮影をご希望ですか？</h2>
        <p class="section-lead">
          イメージに近い写真や案件があれば、それに沿った撮影をご提案します。<br>
          まずは目的や課題をお聞かせください。
        </p>
        <div class="super-cta-actions">
          <a href="contact.html?type=shoot" class="btn primary large">撮影のご相談・ご依頼はこちら</a>
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="写真の拡大表示">
        <button class="lightbox-close" type="button" aria-label="閉じる" data-lightbox-close>×</button>
        <div class="lightbox-image-wrapper">
          <img src="" alt="" id="lightbox-image" />
          <button class="lightbox-nav lightbox-prev" type="button" id="lightbox-prev" aria-label="前の写真">‹</button>
          <button class="lightbox-nav lightbox-next" type="button" id="lightbox-next" aria-label="次の写真">›</button>
        </div>
        <div class="lightbox-meta">
          <p class="lightbox-title" id="lightbox-title"></p>
          <p class="lightbox-caption" id="lightbox-caption"></p>
          <div class="lightbox-thumbs" id="lightbox-thumbs" aria-label="サムネイル一覧"></div>
          <a href="#" id="lightbox-project-link" class="section-link" style="margin-top: 10px;">
            この実績の詳細を見る
          </a>
        </div>
      </div>
    </div>
  </main>

  <site-footer></site-footer>

  <a href="contact.html?type=shoot" class="floating-cta" id="floating-cta">撮影を相談する</a>

  <script src="assets/js/config.js?v=6"></script>
  <script src="assets/js/api.js?v=6"></script>
  <script src="assets/js/motion.js?v=6"></script>
  <script src="assets/js/works.js?v=6"></script>
</body>

</html>
